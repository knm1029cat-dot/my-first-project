<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自己紹介</title>
<style>
  :root {
    --bg: #f7f7f5;
    --card-bg: #ffffff;
    --text: #2b2b2b;
    --sub-text: #6b6b6b;
    --accent: #4a7c6f;
    --border: #e5e5e0;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    padding: 40px 20px;
    background-color: var(--bg);
    color: var(--text);
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Segoe UI", sans-serif;
    line-height: 1.7;
    display: flex;
    justify-content: center;
  }

  .card {
    width: 100%;
    max-width: 640px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 40px;
  }

  .profile-header {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 30px;
  }

  .avatar {
    width: 88px;
    height: 88px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    font-weight: bold;
    flex-shrink: 0;
  }

  .name {
    margin: 0 0 4px;
    font-size: 24px;
  }

  .role {
    margin: 0;
    color: var(--sub-text);
    font-size: 14px;
  }

  section {
    margin-bottom: 28px;
  }

  section:last-child {
    margin-bottom: 0;
  }

  h2 {
    font-size: 15px;
    margin: 0 0 10px;
    color: var(--accent);
    border-bottom: 2px solid var(--border);
    padding-bottom: 8px;
  }

  p {
    margin: 0;
    font-size: 15px;
  }

  ul {
    margin: 0;
    padding-left: 20px;
  }

  li {
    margin-bottom: 6px;
    font-size: 15px;
  }

  .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .tag {
    background: #eef3f1;
    color: var(--accent);
    padding: 4px 12px;
    border-radius: 999px;
    font-size: 13px;
  }
</style>
</head>
<body>

<div class="card">
  <div class="profile-header">
    <div class="avatar">A</div>
    <div>
      <h1 class="name">山田 太郎</h1>
      <p class="role">Webエンジニア</p>
    </div>
  </div>

  <section>
    <h2>自己紹介</h2>
    <p>
      はじめまして。普段はWebアプリケーションの開発をしています。
      新しい技術を学ぶことと、シンプルで使いやすいものを作ることが好きです。
    </p>
  </section>

  <section>
    <h2>スキル</h2>
    <div class="tags">
      <span class="tag">HTML / CSS</span>
      <span class="tag">JavaScript</span>
      <span class="tag">Python</span>
      <span class="tag">Git</span>
    </div>
  </section>

  <section>
    <h2>趣味</h2>
    <ul>
      <li>読書</li>
      <li>カフェ巡り</li>
      <li>写真撮影</li>
    </ul>
  </section>

  <section>
    <h2>連絡先</h2>
    <p>Email: example@example.com</p>
  </section>
</div>

</body>
</html>
